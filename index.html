<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>cocobitraidu</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    text-align: center;
}

h1 {
    margin-bottom: 30px;
}

.card {
    width: 180px;
    margin: auto;
    cursor: pointer;
}

.card img {
    width: 180px;
    border-radius: 15px;
    transition: 0.5s;
    display: block;
}

.info {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: 0.5s;
}

.info h2 {
    margin-bottom: 8px;
}

.info p {
    font-size: 15px;
    line-height: 1.5;
}

.card.active img {
    transform: rotate(-8deg) scale(1.08);
}

.card.active .info {
    max-height: 250px;
    opacity: 1;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

    <h1>cocobitraidu</h1>

    <div class="card" onclick="this.classList.toggle('active')">

        <img src="https://i.postimg.cc/kVkM01Ch/tai-xuong.jpg" alt="Ảnh">

        <div class="info">
            <h2>Ảnh này là...</h2>
            <p>
                Hình ảnh coco bị chụp lén và hóa thành
                Linda với biểu tượng lồn trên ngón tay
                .Từ đó, nó đã được đưa vào cocobitraidu.
            </p>
        </div>

    </div>

</div>

</body>
</html>
